# tmux-flow.conf — plugin bootstrap
#
# tmux-flow's key bindings, mouse support and status bar are compiled into the
# binary. They work with no configuration at all, and this file is not needed
# for any of them.
#
# This file exists only to load the three plugins that ship alongside tmux-flow,
# because plugins cannot be compiled in. To use them, add one line to
# ~/.tmux.conf:
#
#     source /opt/homebrew/share/tmux-flow/tmux-flow.conf
#
# `brew info tmux-flow` prints the exact path for your install. The @@PKGSHARE@@
# placeholders below are rewritten to that path by the Homebrew formula.

# ── Catppuccin theme ─────────────────────────────────────────────────────────
# switch-theme.sh sets @catppuccin_flavor from the terminal's light and dark
# hooks. The plugin sets its own default of mocha when nothing else has, so no
# flavour is forced here.
run-shell "@@PKGSHARE@@/plugins/catppuccin/catppuccin.tmux"

# ── Session save and restore ─────────────────────────────────────────────────
# resurrect provides the save and restore commands and binds them under the
# prefix. continuum drives resurrect on a timer and must load after it; its
# default interval is 15 minutes.
run-shell "@@PKGSHARE@@/plugins/tmux-resurrect/resurrect.tmux"
run-shell "@@PKGSHARE@@/plugins/tmux-continuum/continuum.tmux"
